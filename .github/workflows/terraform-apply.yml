name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  apply:
    name: Apply (github)
    runs-on: ubuntu-latest
    environment:
      name: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false
        env:
          TF_VAR_github_token: ${{ secrets.BOT_TOKEN }}

      - name: Terraform Apply
        id: tfapply
        run: |
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_github_token: ${{ secrets.BOT_TOKEN }}
