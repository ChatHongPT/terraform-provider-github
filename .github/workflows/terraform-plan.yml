name: Terraform Plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write
  deployments: write

jobs:
  plan:
    name: Plan (github)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Terraform Init
        run: |
          terraform init -input=false
        env:
          TF_VAR_github_token: ${{ secrets.BOT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Terraform Validate
        run: |
          terraform fmt -check
          terraform validate -no-color
        env:
          TF_VAR_github_token: ${{ secrets.BOT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Terraform Plan
        id: plan
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          # detailed-exitcode: 0=no changes, 2=changes present, 1=error
          terraform plan -detailed-exitcode -no-color -input=false -out=tfplan.binary |& tee plan.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          if [ -f tfplan.binary ]; then
            terraform show -no-color tfplan.binary > tfplan.txt || true
          fi
        env:
          TF_VAR_github_token: ${{ secrets.BOT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Post Plan result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planResult = fs.existsSync('tfplan.txt') ? fs.readFileSync('tfplan.txt', 'utf8') : '';
            const planLog = fs.existsSync('plan.log') ? fs.readFileSync('plan.log', 'utf8') : '';

            const allText = `${planLog}\n${planResult}`;
            const match = allText.match(/Plan:\s*\d+\s+to add,\s*\d+\s+to change,\s*\d+\s+to destroy\.?/);
            const summary = match ? match[0] : 'No summary found';

            const fullOutput = (planResult || planLog || 'No plan output found').slice(0, 65000);

            const comment = `## Plan Result (github)

            **Status:** ${process.env.PLAN_OUTCOME || 'unknown'} (exit ${process.env.PLAN_EXIT_CODE || 'n/a'})

            **Plan Summary:**
            \`\`\`
            ${summary}
            \`\`\`

            **Full Plan Output:**
            <details>
            <summary>Click to expand</summary>

            \`\`\`hcl
            ${fullOutput}
            \`\`\`
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}

      - name: Require deployment review before Apply
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: terraform
          ref: ${{ github.head_ref }}
          desc: "terraform needs approval to start deploying changes."
